# Exo's call relay (README.md). Deployed by `npx wrangler@4.158.0 deploy` from this folder.
name = "exo-relay"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# No logs: the relay keeps nothing about who connects or what passes through.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "TOPICS"
class_name = "Topic"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Topic"]
