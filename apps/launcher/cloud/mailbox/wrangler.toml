# Exo's mailbox (README.md). Live as exo-mailbox; `npx wrangler@4.165.0 dev` runs it on this PC; redeploying needs the owner's OK.
name = "exo-mailbox"
main = "src/worker.js"
compatibility_date = "2026-11-18"
workers_dev = true
preview_urls = false
send_metrics = false

# No logs: the mailbox keeps nothing about who connects.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "BOXES"
class_name = "Box"

[[durable_objects.bindings]]
name = "LINKS"
class_name = "Link"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Box", "Link"]

# The profile's media too big for a row: encrypted parts, by box (src/media.js).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "replace-with-bucket-name"

# Nameplate guesses per address, counted by Cloudflare at the edge for a minute; the Worker stores none.
[[ratelimits]]
name = "LINK_GUESSES"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The dev copy (`wrangler deploy --env dev`), on the free plan, with Durable Objects of its own.
[env.dev]
name = "exo-mailbox-dev"
workers_dev = true

[env.dev.observability]
enabled = false

[[env.dev.durable_objects.bindings]]
name = "BOXES"
class_name = "Box"

[[env.dev.durable_objects.bindings]]
name = "LINKS"
class_name = "Link"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["Box", "Link"]

[[env.dev.r2_buckets]]
binding = "MEDIA"
bucket_name = "replace-with-bucket-name"

[[env.dev.ratelimits]]
name = "LINK_GUESSES"
namespace_id = "1101"
simple = { limit = 10, period = 60 }
