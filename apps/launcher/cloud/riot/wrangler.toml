name = "exo-riot"
main = "src/worker.js"
compatibility_date = "2026-11-18"
workers_dev = false
preview_urls = false
send_metrics = false

routes = [{ pattern = "riot.getexo.app", custom_domain = true }]

[observability]
enabled = false

[[kv_namespaces]]
binding = "RIOT_CACHE"
id = "REPLACE_WITH_RESOURCE_ID"

[[ratelimits]]
name = "RIOT_LIMIT"
namespace_id = "5101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RIOT_LOOKUP_LIMIT"
namespace_id = "5102"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RIOT_UPSTREAM_LIMIT"
namespace_id = "5103"
simple = { limit = 200, period = 60 }
