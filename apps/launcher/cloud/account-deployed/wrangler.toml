name = "exo-account"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
send_metrics = false
routes = []

[placement]
mode = "smart"

[observability]
enabled = false

[vars]
APPLE_APP_ID = "app.getexo.exo"
PUBLIC_URL = "https://accounts.getexo.app"

[[d1_databases]]
binding = "DB"
database_name = "exo-account"
database_id = "REPLACE_WITH_RESOURCE_ID"

[[ratelimits]]
name = "SESSION_TRIES"
namespace_id = "3002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SYNC_TRIES"
namespace_id = "3003"
simple = { limit = 120, period = 60 }
