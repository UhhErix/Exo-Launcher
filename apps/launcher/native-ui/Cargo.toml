[workspace]
resolver = "3"
members = [
    "crates/exo-auth",
    "crates/exo-policy",
    "crates/exo-host",
    "crates/exo-wire",
    "crates/exo-rpc",
    "crates/exo-kit",
    "crates/exo-macros",
    "crates/exo-macros-worker",
    "crates/exo-controller",
    "crates/exo-hid-devices",
    "crates/exo-power-guard",
    "crates/exo-sensors",
    "crates/exo-gpu",
    "crates/exo-present",
    "crates/exo-stores",
    "crates/exo-ui",
    "crates/exo-shaders",
    "crates/exo-thermal",
    "crates/exo-display",
    "crates/exo-light",
    "crates/exo-net-latency",
    "crates/exo-flow",
    "crates/exo-autopilot",
    "crates/exo-upscale",
    "crates/exo-voice-ml",
    "crates/exo-fg-bridge",
    "crates/exo-audio-apo",
    "crates/exo-capture",
    "crates/exo-delta",
    "crates/exo-installer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7", default-features = false, features = ["accessibility"] }
rune-kit = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7", default-features = false }
rune-media = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7", default-features = false }
rune-ui = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7" }
winit = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7" }
sctk-adwaita = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7" }
parley_engine = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7" }
accesskit_windows = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7" }
accesskit_macos = { git = "https://github.com/UhhErix/rune", rev = "986d513027fd19257534790bad76284a5d6b7df7" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false
panic = "abort"

[profile.release-cdylib]
inherits = "release"
panic = "unwind"

