[workspace]
resolver = "3"
members = [
    "crates/exo-rpc",
    "crates/exo-kit",
    "crates/exo-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "14b59a3434b49d5f117140d865482f080c7caa32" }
rune-media = { git = "https://github.com/anomalyco/rune", rev = "14b59a3434b49d5f117140d865482f080c7caa32", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "14b59a3434b49d5f117140d865482f080c7caa32" }
winit = { git = "https://github.com/anomalyco/rune", rev = "14b59a3434b49d5f117140d865482f080c7caa32" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "14b59a3434b49d5f117140d865482f080c7caa32" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "14b59a3434b49d5f117140d865482f080c7caa32" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "14b59a3434b49d5f117140d865482f080c7caa32" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "14b59a3434b49d5f117140d865482f080c7caa32" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
