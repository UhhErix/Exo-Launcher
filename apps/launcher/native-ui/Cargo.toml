[workspace]
resolver = "3"
members = [
    "crates/exo-rpc",
    "crates/exo-kit",
    "crates/exo-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/UhhErix/rune", rev = "1735bc26b094cd8264802aef3799f73e6eddd4a2" }
rune-media = { git = "https://github.com/UhhErix/rune", rev = "1735bc26b094cd8264802aef3799f73e6eddd4a2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/UhhErix/rune", rev = "1735bc26b094cd8264802aef3799f73e6eddd4a2" }
winit = { git = "https://github.com/UhhErix/rune", rev = "1735bc26b094cd8264802aef3799f73e6eddd4a2" }
sctk-adwaita = { git = "https://github.com/UhhErix/rune", rev = "1735bc26b094cd8264802aef3799f73e6eddd4a2" }
parley_engine = { git = "https://github.com/UhhErix/rune", rev = "1735bc26b094cd8264802aef3799f73e6eddd4a2" }
accesskit_windows = { git = "https://github.com/UhhErix/rune", rev = "1735bc26b094cd8264802aef3799f73e6eddd4a2" }
accesskit_macos = { git = "https://github.com/UhhErix/rune", rev = "1735bc26b094cd8264802aef3799f73e6eddd4a2" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
