[workspace]
resolver = "3"
members = [
    "crates/exo-rpc",
    "crates/exo-kit",
    "crates/exo-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/UhhErix/rune", rev = "3126667fefda00b4dd41e8351cffb04dc1cf7f9d" }
rune-media = { git = "https://github.com/UhhErix/rune", rev = "3126667fefda00b4dd41e8351cffb04dc1cf7f9d", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/UhhErix/rune", rev = "3126667fefda00b4dd41e8351cffb04dc1cf7f9d" }
winit = { git = "https://github.com/UhhErix/rune", rev = "3126667fefda00b4dd41e8351cffb04dc1cf7f9d" }
sctk-adwaita = { git = "https://github.com/UhhErix/rune", rev = "3126667fefda00b4dd41e8351cffb04dc1cf7f9d" }
parley_engine = { git = "https://github.com/UhhErix/rune", rev = "3126667fefda00b4dd41e8351cffb04dc1cf7f9d" }
accesskit_windows = { git = "https://github.com/UhhErix/rune", rev = "3126667fefda00b4dd41e8351cffb04dc1cf7f9d" }
accesskit_macos = { git = "https://github.com/UhhErix/rune", rev = "3126667fefda00b4dd41e8351cffb04dc1cf7f9d" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
