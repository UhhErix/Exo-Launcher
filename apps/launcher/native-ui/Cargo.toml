[workspace]
resolver = "3"
members = [
    "crates/exo-auth",
    "crates/exo-rpc",
    "crates/exo-kit",
    "crates/exo-macros",
    "crates/exo-macros-worker",
    "crates/exo-controller",
    "crates/exo-power-guard",
    "crates/exo-sensors",
    "crates/exo-gpu",
    "crates/exo-ui",
    "crates/exo-shaders",
    "crates/exo-thermal",
    "crates/exo-display",
    "crates/exo-light",
    "crates/exo-net-latency",
    "crates/exo-flow",
    "crates/exo-autopilot",
    "crates/exo-upscale",
    "crates/exo-voice-ml",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8" }
rune-kit = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8", default-features = false }
rune-media = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8", default-features = false }
rune-ui = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8" }
winit = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8" }
sctk-adwaita = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8" }
parley_engine = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8" }
accesskit_windows = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8" }
accesskit_macos = { git = "https://github.com/UhhErix/rune", rev = "c73c6f51c4a49b866e115c33cc77a8c99f2c7ad8" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
