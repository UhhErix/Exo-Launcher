[workspace]
resolver = "3"
members = [
    "crates/exo-auth",
    "crates/exo-wire",
    "crates/exo-rpc",
    "crates/exo-kit",
    "crates/exo-macros",
    "crates/exo-macros-worker",
    "crates/exo-controller",
    "crates/exo-power-guard",
    "crates/exo-sensors",
    "crates/exo-gpu",
    "crates/exo-present",
    "crates/exo-ui",
    "crates/exo-shaders",
    "crates/exo-thermal",
    "crates/exo-display",
    "crates/exo-light",
    "crates/exo-net-latency",
    "crates/exo-flow",
    "crates/exo-autopilot",
    "crates/exo-upscale",
    "crates/exo-voice-ml",
    "crates/exo-fg-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536" }
rune-kit = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536", default-features = false }
rune-media = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536", default-features = false }
rune-ui = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536" }
winit = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536" }
sctk-adwaita = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536" }
parley_engine = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536" }
accesskit_windows = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536" }
accesskit_macos = { git = "https://github.com/UhhErix/rune", rev = "24e165628b5e1a59c9febda9430e3579ac7d1536" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
