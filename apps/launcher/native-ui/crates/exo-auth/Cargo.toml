    "Security_Credentials",
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WindowsWebServices",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
