[package]
name = "exo-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
exo-autopilot = { path = "../exo-autopilot" }
exo-controller = { path = "../exo-controller" }
exo-gpu = { path = "../exo-gpu" }
exo-kit = { path = "../exo-kit" }
exo-macros = { path = "../exo-macros" }
exo-power-guard = { path = "../exo-power-guard" }
exo-rpc = { path = "../exo-rpc" }
exo-sensors = { path = "../exo-sensors" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rune.workspace = true
rune-media.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
