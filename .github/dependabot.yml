version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - "/apps/launcher/cloud/*"
      - "/apps/launcher/mouse"
      - "/apps/launcher/relay"
      - "/apps/launcher/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directories:
      - "/apps/launcher/ExoLauncher"
      - "/apps/launcher/ExoLauncher.SteamIpc"
      - "/apps/launcher/ExoLauncher.Tests"
      - "/apps/launcher/Exo.Identity"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
