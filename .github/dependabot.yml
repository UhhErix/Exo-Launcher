version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - "/apps/launcher/cloud/*"
      - "/apps/launcher/mouse"
      - "/apps/launcher/relay"
      - "/apps/launcher/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned: mouse/scripts/patch-protocol.mjs patches this exact version and stops the build on any other,
      # and THIRD_PARTY_NOTICES names it. A new version is a deliberate change, not a Dependabot bump.
      - dependency-name: "@openmouse/protocol"
      # Pinned repo-wide: every deploy and release script runs npx wrangler@<version>, and covers' @cloudflare/vitest-plugin
      # is held at the release that bundles that same Wrangler. Move them together, by hand.
      - dependency-name: "wrangler"
      - dependency-name: "@cloudflare/vitest-plugin"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: nuget
    directories:
      - "/apps/launcher/ExoLauncher"
      - "/apps/launcher/ExoLauncher.SteamIpc"
      - "/apps/launcher/ExoLauncher.Tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The 11.x train follows .NET 11, which waits on docs/RUNTIME_RELEASE_READINESS.md; 10.0.x patches still come.
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
