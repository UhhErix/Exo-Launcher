name: Sign and publish Exo delta packs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to sign and attach packs to (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      previous_tag:
        description: Optional previous release tag for delta.exopack generation
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: release-delta-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-delta-packs:
    name: Sign delta and full .exopack assets
    if: ${{ github.repository == 'UhhErix/Exo-Launcher' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            apps/launcher/native-ui
            apps/launcher/tools/AppFiles
            apps/launcher/ExoLauncher/Services/AppFiles.cs
            apps/launcher/global.json
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build exo-delta signer
        shell: pwsh
        working-directory: apps/launcher/native-ui
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p exo-delta

      - name: Download release payload tree(s)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$') {
            throw 'release_tag must match vMAJOR.MINOR.PATCH'
          }
          if ($env:PREVIOUS_TAG -and $env:PREVIOUS_TAG -notmatch '^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$') {
            throw 'previous_tag must match vMAJOR.MINOR.PATCH'
          }
          function Resolve-ReleaseTree([string]$Tag, [string]$WorkRoot, [string]$OutDir) {
            New-Item -ItemType Directory -Force -Path $WorkRoot, $OutDir | Out-Null
            $assets = @(gh release view $Tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Could not list assets for release $Tag." }
            if ($assets -contains 'ExoLauncher-win-x64.zip') {
              $zipDir = Join-Path $WorkRoot 'zip'
              New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
              gh release download $Tag --pattern 'ExoLauncher-win-x64.zip' --dir $zipDir
              if ($LASTEXITCODE -ne 0) { throw "Failed to download ExoLauncher-win-x64.zip for $Tag." }
              Expand-Archive -Path (Join-Path $zipDir 'ExoLauncher-win-x64.zip') -DestinationPath $OutDir -Force
              return
            }
            if (($assets -contains 'files.json') -and ($assets -contains 'files.pack')) {
              $packDir = Join-Path $WorkRoot 'pack'
              New-Item -ItemType Directory -Force -Path $packDir | Out-Null
              gh release download $Tag --pattern 'files.json' --pattern 'files.pack' --dir $packDir
              if ($LASTEXITCODE -ne 0) { throw "Failed to download files.json/files.pack for $Tag." }
              dotnet run --project apps/launcher/tools/AppFiles/AppFiles.csproj -c Release -- unpack `
                --manifest (Join-Path $packDir 'files.json') `
                --pack (Join-Path $packDir 'files.pack') `
                --out $OutDir
              if ($LASTEXITCODE -ne 0) { throw "Failed to unpack files.pack for $Tag." }
              return
            }
            throw "Release $Tag lacks both ExoLauncher-win-x64.zip and files.json/files.pack."
          }

          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\exo-pack\out" | Out-Null
          Resolve-ReleaseTree $env:RELEASE_TAG "$env:RUNNER_TEMP\exo-pack\new-src" "$env:RUNNER_TEMP\exo-pack\new"
          if ($env:PREVIOUS_TAG) {
            Resolve-ReleaseTree $env:PREVIOUS_TAG "$env:RUNNER_TEMP\exo-pack\old-src" "$env:RUNNER_TEMP\exo-pack\old"
          }

      - name: Build and Ed25519-sign full.exopack and delta.exopack
        shell: pwsh
        env:
          EXO_DELTA_ED25519_PRIVATE_KEY: ${{ secrets.EXO_DELTA_ED25519_PRIVATE_KEY }}
          EXO_DELTA_RELEASE_PUBKEY_HEX: ${{ vars.EXO_DELTA_RELEASE_PUBKEY_HEX }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:EXO_DELTA_ED25519_PRIVATE_KEY) {
            throw 'Repository secret EXO_DELTA_ED25519_PRIVATE_KEY is not configured.'
          }
          if (-not $env:EXO_DELTA_RELEASE_PUBKEY_HEX) {
            throw 'Repository variable EXO_DELTA_RELEASE_PUBKEY_HEX is not configured.'
          }
          $deltaExe = 'apps/launcher/native-ui/target/release/exo-delta.exe'
          $newDir = "$env:RUNNER_TEMP\exo-pack\new"
          $outDir = "$env:RUNNER_TEMP\exo-pack\out"

          & $deltaExe build-full $newDir "$outDir\full.exopack" --level 12 --sign-key-env EXO_DELTA_ED25519_PRIVATE_KEY --sig-out "$outDir\full.exopack.sig"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $deltaExe verify $newDir "$outDir\full.exopack" --sig "$outDir\full.exopack.sig" --pubkey-hex $env:EXO_DELTA_RELEASE_PUBKEY_HEX
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($env:PREVIOUS_TAG) {
            $oldDir = "$env:RUNNER_TEMP\exo-pack\old"
            & $deltaExe build-delta $oldDir $newDir "$outDir\delta.exopack" --level 12 --sign-key-env EXO_DELTA_ED25519_PRIVATE_KEY --sig-out "$outDir\delta.exopack.sig"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $deltaExe verify $newDir "$outDir\delta.exopack" --sig "$outDir\delta.exopack.sig" --pubkey-hex $env:EXO_DELTA_RELEASE_PUBKEY_HEX
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload signed packs to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = "$env:RUNNER_TEMP\exo-pack\out"
          $assets = @("$outDir\full.exopack", "$outDir\full.exopack.sig")
          if ($env:PREVIOUS_TAG) {
            $assets += @("$outDir\delta.exopack", "$outDir\delta.exopack.sig")
          }
          gh release upload $env:RELEASE_TAG $assets --clobber
