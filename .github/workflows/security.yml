name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    name: Security — zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            .github
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          inputs: .github/workflows
          online-audits: false
          advanced-security: true

  osv-scanner:
    name: Security — OSV-Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        -r
        apps/launcher
      fail-on-vuln: false
      upload-sarif: true

  trivy-secrets:
    name: Security — Trivy Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false

      - name: Run Trivy secret scan (table report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '0'
          hide-progress: true

      - name: Run Trivy secret scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: trivy-secrets.sarif
          exit-code: '0'
          hide-progress: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

  semgrep:
    name: Security — Semgrep (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned Semgrep
        run: python -m pip install --no-input semgrep==1.186.0

      - name: Scan PR diff with Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SEMGREP_SEND_METRICS: 'off'
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/csharp \
            --config p/typescript \
            --config p/rust \
            --baseline-commit "$BASE_SHA" \
            --sarif-output semgrep.sarif \
            --text \
            --metrics=off || true

      - name: Upload Semgrep SARIF
        if: hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-pr-diff

  cargo-deny:
    name: Security — cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            apps/launcher/native-ui
          persist-credentials: false

      - name: Check native-ui advisories, bans, and licenses
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: apps/launcher/native-ui/Cargo.toml
          arguments: --all-features
          command: check
          command-arguments: --config apps/launcher/native-ui/deny.toml advisories bans licenses
