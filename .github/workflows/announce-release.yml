name: Announce stable release on Discord

on:
  release:
    types: [published]

permissions: {}

jobs:
  announce:
    if: ${{ github.repository == 'UhhErix/Exo-Launcher' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    # The exo-updates Worker reads the release from GitHub when asked here, and posts the card once per tag (it also posts it
    # by itself the first time it offers the release). Until the release is ready to offer it answers 409 not-live.
    timeout-minutes: 25
    steps:
      - name: Request an announcement from Cloudflare
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}', tag):
              raise SystemExit('Release tag must use vMAJOR.MINOR.PATCH.')

          def ask():
              request = Request(
                  'https://updates.getexo.app/v1/launcher/announce',
                  data=json.dumps({'tag': tag}).encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'User-Agent': 'ExoReleaseAnnouncer/1.0 (+https://github.com/UhhErix/Exo-Launcher)'},
                  method='POST',
              )
              try:
                  response = urlopen(request, timeout=20)
              except HTTPError as error:
                  response = error
              except (URLError, TimeoutError, OSError):
                  return 0, {'status': 'transient'}

              with response:
                  code = response.code
                  try:
                      return code, json.load(response)
                  except (UnicodeError, ValueError):
                      raise SystemExit(f'Cloudflare returned HTTP {code} without a valid announcement response.')

          # Until the mirror serves the tag the Worker answers 409 not-live: ask with progressive backoff, for ~20 minutes.
          delays = [5, 5, 10, 10, 15, 20]
          for attempt in range(44):
              code, result = ask()
              retrying = code == 0 or (code == 409 and isinstance(result, dict) and result.get('status') == 'not-live')
              if not retrying:
                  break
              wait = delays[attempt] if attempt < len(delays) else 30
              print(f'Retryable response for {tag} (HTTP {code}, try {attempt + 1} of 44); asking again in {wait} seconds.')
              time.sleep(wait)

          status = result.get('status') if isinstance(result, dict) else None
          if code == 200 and status in ('posted', 'already'):
              print(f'Cloudflare announcement status: {status}.')
          elif code == 409 and status in ('not-live', 'wrong-version'):
              raise SystemExit('Publish the matching Cloudflare release and release notes, then rerun this job.')
          else:
              raise SystemExit(f'Cloudflare could not confirm Discord delivery (HTTP {code}).')
          PY
